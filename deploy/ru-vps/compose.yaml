name: ozon-ai-analytics
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ozon_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-ozon_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozon_app} -d ${POSTGRES_DB:-ozon_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    mem_limit: 320m
    cpus: 0.45
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ozon_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ozon_analytics}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: [internal]
    mem_limit: 420m
    cpus: 0.45
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]
    mem_limit: 96m
    cpus: 0.15
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  internal:
    driver: bridge

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#102b51"/><stop offset="1" stop-color="#020816"/></linearGradient><linearGradient id="hair" x2="1" y2="1"><stop stop-color="#d0f7ff"/><stop offset=".35" stop-color="#55caff"/><stop offset="1" stop-color="#2461c7"/></linearGradient><linearGradient id="suit" x2="1" y2="1"><stop stop-color="#132c4c"/><stop offset=".55" stop-color="#050b18"/><stop offset="1" stop-color="#1d5b8c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<style>
#mouth{transform-box:fill-box;transform-origin:center;animation:softTalk 4.8s ease-in-out infinite}
.lid{transform-box:fill-box;transform-origin:center;transform:scaleY(0);animation:blink 5.2s infinite}
#fringe{transform-box:fill-box;transform-origin:50% 0%;animation:hairSway 6s ease-in-out infinite}
@keyframes blink{0%,91%,94%,100%{transform:scaleY(0)}92.5%{transform:scaleY(1)}}
@keyframes softTalk{0%,82%,100%{transform:scaleY(1)}86%{transform:scaleY(.55)}90%{transform:scaleY(1.25)}94%{transform:scaleY(.7)}}
@keyframes hairSway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(1.2deg)}}
</style>

name: Ozon read-only orders export

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of completed UTC days to export (1-365)"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  export-postings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
      - name: Validate Python syntax and unit tests
        run: |
          python -m py_compile scripts/fetch_postings.py scripts/build_postings_report.py
          python -m pytest -q
      - name: Export FBO and FBS postings
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          SALES_DAYS: ${{ inputs.days }}
        run: python scripts/fetch_postings.py
      - name: Build orders and delivered products report
        run: python scripts/build_postings_report.py
      - name: Add report to job summary
        run: cat output/postings-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw postings and report
        uses: actions/upload-artifact@v5
        with:
          name: ozon-orders-and-report
          path: |
            output/ozon-postings.json
            output/postings-report.md
          retention-days: 7

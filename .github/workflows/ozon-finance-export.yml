name: Ozon read-only finance export

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of completed UTC days to export (1-31)"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  export-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Export Ozon finance accruals
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          FINANCE_DAYS: ${{ inputs.days }}
        run: python scripts/fetch_finance.py
      - name: Build finance report
        run: python scripts/build_finance_report.py
      - name: Add report to job summary
        run: cat output/finance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload finance data and report
        uses: actions/upload-artifact@v5
        with:
          name: ozon-finance-and-report
          path: |
            output/ozon-finance.json
            output/finance-report.md
          retention-days: 7

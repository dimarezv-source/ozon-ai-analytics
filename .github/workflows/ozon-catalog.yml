name: Ozon read-only catalog export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch catalog (read-only)
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python scripts/fetch_catalog.py

      - name: Fetch read-only prices and commissions
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python scripts/fetch_prices.py

      - name: Build price and commission report
        run: python scripts/build_prices_report.py

      - name: Build Markdown report
        run: python scripts/build_report.py

      - name: Show report in GitHub Actions
        if: always()
        run: |
          if [ -f output/prices-report.md ]; then
            cat output/prices-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Price/commission report was not generated. Check the fetch step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f output/report.md ]; then
            cat output/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Catalog report was not generated. Check the fetch step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload catalog and report
        uses: actions/upload-artifact@v4
        with:
          name: ozon-catalog-and-report
          path: |
            output/ozon-products.json
            output/ozon-prices.json
            output/prices-report.md
            output/report.md
          if-no-files-found: warn
          retention-days: 7

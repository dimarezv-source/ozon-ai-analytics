name: Ozon read-only catalog export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch catalog (read-only)
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python scripts/fetch_catalog.py

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: ozon-catalog
          path: output/ozon-products.json
          if-no-files-found: error
          retention-days: 7
